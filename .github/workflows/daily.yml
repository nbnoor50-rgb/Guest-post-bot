name: Noor Daily Bot
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python bot.py
      - run: |
          git config --global user.name "Noor Bot"
          git config --global user.email "nbnoor50@gmail.com"
          git add daily_report.txt
          git commit -m "Daily report" || true
          git push